name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets
        env:
          B64: ${{ secrets.MX_KEYSTORE_B64 }}
        run: test -n "$B64" || (echo "Missing secret MX_KEYSTORE_B64" && exit 1)
      - name: Decode keystore
        env:
          B64: ${{ secrets.MX_KEYSTORE_B64 }}
        run: echo "$B64" | base64 -d > "$RUNNER_TEMP/matrix.jks"
      - run: sed -i '/aapt2FromMavenOverride/d' gradle.properties
      - name: Build signed release APK
        env:
          MX_KEYSTORE: ${{ runner.temp }}/matrix.jks
          MX_STORE_PASS: ${{ secrets.MX_STORE_PASS }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASS: ${{ secrets.MX_KEY_PASS }}
        run: |
  chmod +x gradlew
  for attempt in 1 2 3; do
    echo "==> Build attempt $attempt"
    if ./gradlew assembleRelease --no-daemon; then
      exit 0
    fi
    echo "==> Attempt $attempt failed, retrying in 30s (likely a transient Gradle download timeout)"
    rm -rf ~/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*-bin.zip.part 2>/dev/null || true
    sleep 30
  done
  echo "All 3 attempts failed."
  exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: MaTrIX-Co-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
