name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ensure SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(command -v sdkmanager || true)
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" || echo "sdkmanager skipped"
      - run: sed -i '/aapt2FromMavenOverride/d' gradle.properties
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaTrIX-Co-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
